[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mini-sql-query-engine"
version = "0.1.0"
description = "A small educational SQL parser, planner, and execution engine"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
mini-sql-query-engine = "minisql.cli:main"

[tool.setuptools.packages.find]
include = ["minisql*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
